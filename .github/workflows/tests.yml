name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -v
        env:
          PROOFPILOT_LLM: "off"
      - name: Offline end-to-end CLI run
        run: python -m proofpilot "Compare open-source agent frameworks for a student project" --offline --no-memory --quiet --out brief.md && head -20 brief.md
